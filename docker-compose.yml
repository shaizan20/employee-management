# ═══════════════════════════════════════════════
#  Employee Management System - Docker Compose
# ═══════════════════════════════════════════════

version: '3.8'

services:
  # ─── MySQL Database ─────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ems-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: employee_management
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-padmin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ems-network

  # ─── Node.js Application ───────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: admin
      DB_NAME: employee_management
      DB_PORT: 3306
      SESSION_SECRET: emp-mgmt-secret-key-2024
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ems-network

# ─── Volumes ──────────────────────────────────
volumes:
  mysql_data:
    driver: local

# ─── Networks ─────────────────────────────────
networks:
  ems-network:
    driver: bridge
